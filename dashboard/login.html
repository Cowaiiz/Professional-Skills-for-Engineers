<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Home IoT</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="shell">
    <p class="identity">Home IoT</p>
    <h1>Sign in</h1>
    <p class="intro">View your living room readings and alerts.</p>
    <form method="post" action="/login">
      <label for="login-user">Username</label>
      <input id="login-user" name="username" autocomplete="username" maxlength="64" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" name="password" autocomplete="current-password" maxlength="256" required>
      <p class="feedback" role="status"><!-- auth-message --></p>
      <button type="submit">Sign in</button>
    </form>
    <!-- signup-link -->
  </main>
</body>
</html>
